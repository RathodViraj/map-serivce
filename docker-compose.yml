services:
  app:
    build:
      context: .
      dockerfile: app.dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-amd64}
    image: mapservice:latest
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-20s}
      CACHE_TTL: ${CACHE_TTL:-5m}
      RETRY_COUNT: ${RETRY_COUNT:-3}
      RETRY_DELAY: ${RETRY_DELAY:-500ms}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-5s}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - nearby-net

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nearby-net

networks:
  nearby-net:
    driver: bridge
