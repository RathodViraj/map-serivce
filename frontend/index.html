<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nearby Services Finder</title>
    <meta
      name="description"
      content="Find nearby hospitals, restaurants, pharmacies, petrol pumps, and shops on an interactive map."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__badge">NSF</div>
          <div>
            <h1>Nearby Services Finder</h1>
            <p>OpenStreetMap powered nearby search</p>
          </div>
        </div>

        <section class="panel panel--controls">
          <div class="panel__header">
            <h2>Search controls</h2>
            <button id="refreshLocationButton" class="ghost-button" type="button">Refresh location</button>
          </div>

          <label class="field">
            <span>Category</span>
            <select id="categorySelect" class="category-select">
              <option value="hospital" class="category-option">Hospital</option>
              <option value="restaurant" selected class="category-option">Restaurant</option>
              <option value="pharmacy" class="category-option">Pharmacy</option>
              <option value="fuel" class="category-option">Fuel</option>
              <option value="shop" class="category-option">Shop</option>
            </select>
          </label>

          <label class="field">
            <div class="field__row">
              <span>Radius</span>
              <strong id="radiusValue">2000 m</strong>
            </div>
            <input id="radiusRange" type="range" min="500" max="5000" step="250" value="2000" />
            <div class="field__helper">
              <span>500 m</span>
              <span>5 km</span>
            </div>
          </label>
        </section>

        <section class="panel panel--status">
          <div class="panel__header">
            <h2>Status</h2>
            <span id="statusBadge" class="status-badge status-badge--idle">Idle</span>
          </div>
          <p id="statusText" class="status-text">Allow location access to find nearby places.</p>
          <div class="location-card">
            <div>
              <span class="location-card__label">Latitude</span>
              <strong id="latitudeText">--</strong>
            </div>
            <div>
              <span class="location-card__label">Longitude</span>
              <strong id="longitudeText">--</strong>
            </div>
          </div>
        </section>

        <section class="panel panel--results">
          <div class="panel__header">
            <h2>Nearby places</h2>
            <span id="resultCount" class="result-count">0</span>
          </div>
          <div id="resultsList" class="results-list" aria-live="polite"></div>
        </section>
      </aside>

      <main class="map-stage">
        <div id="map" class="map"></div>
        <div id="loadingOverlay" class="loading-overlay hidden" aria-live="assertive">
          <div class="spinner" aria-hidden="true"></div>
          <div>
            <strong id="loadingTitle">Searching nearby places</strong>
            <p id="loadingSubtitle">Please wait while we update the map.</p>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
  </body>
</html>
